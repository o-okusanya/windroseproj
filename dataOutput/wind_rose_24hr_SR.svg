ass="g-gtitle"><text class="gtitle" x="65" y="50" text-anchor="start" dy="0em" style="opacity: 1; font-family: 'Open Sans', verdana, arial, sans-serif; font-size: 16px; fill: rgb(42, 63, 95); fill-opacity: 1; white-space: pre;"><tspan class="line" dy="0em" x="65" y="50">Wind Rose — CBIBS Station SR</tspan><tspan class="line" dy="1.3em" x="65" y="50">​<tspan style="font-size:70%" dy="-0.6em">2026-07-05 to 2026-07-06</tspan><tspan dy="0.42em">​</tspan></tspan></text></g><g class="g-polartitle"/><g class="annotation" data-index="0" style="opacity: 1;"><g class="annotation-text-g" transform="rotate(0,861.1999999999999,386)"><g class="cursor-pointer" transform="translate(741,310)"><rect class="bg" x="0.5" y="0.5" width="239" height="151" style="stroke-width: 1px; stroke: rgb(0, 0, 0); stroke-opacity: 0; fill: rgb(0, 0, 0); fill-opacity: 0;"/><text class="annotation-text" text-anchor="start" x="2" y="12" style="font-family: 'Open Sans', verdana, arial, sans-serif; font-size: 9.5px; fill: rgb(42, 63, 95); fill-opacity: 1; white-space: pre;"><tspan class="line" dy="0em" x="2" y="12"><tspan style="font-weight:bold">How to Read the Wind Rose</tspan></tspan><tspan class="line" dy="1.3em" x="2" y="12"></tspan><tspan class="line" dy="2.6em" x="2" y="12"><tspan style="font-weight:bold">Direction:</tspan> Each spoke points in the</tspan><tspan class="line" dy="3.9000000000000004em" x="2" y="12">direction the wind is coming FROM.</tspan><tspan class="line" dy="5.2em" x="2" y="12">North (top) means wind blowing southward.</tspan><tspan class="line" dy="6.5em" x="2" y="12"></tspan><tspan class="line" dy="7.800000000000001em" x="2" y="12"><tspan style="font-weight:bold">Length:</tspan> The longer the spoke, the more</tspan><tspan class="line" dy="9.1em" x="2" y="12">frequently wind came from that direction.</tspan><tspan class="line" dy="10.4em" x="2" y="12"></tspan><tspan class="line" dy="11.700000000000001em" x="2" y="12"><tspan style="font-weight:bold">Color:</tspan> Each color band represents a wind</tspan><tspan class="line" dy="13em" x="2" y="12">speed range (m/s). Lighter blue = calm winds,</tspan><tspan class="line" dy="14.3em" x="2" y="12">dark navy = strong winds, orange/red = highest.</tspan></text></g></g></g></g></svg>